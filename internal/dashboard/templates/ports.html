{{define "content"}}
<div class="card">
  <div class="card-head">
    <span class="card-title">// ports & services</span>
    <span class="card-count" id="pCount">—</span>
    <div style="display:flex;gap:5px;margin-left:auto">
      <select class="fs" id="pDomExp" style="height:26px"><option value="">domain...</option></select>
      <button class="btn btn-ghost btn-sm" onclick="dlCSV()">CSV</button>
      <button class="btn btn-ghost btn-sm" onclick="dlIPs()">IPs</button>
      <button class="btn btn-ghost btn-sm" onclick="dlMSF()">MSF.rc</button>
    </div>
  </div>
  <div class="filters">
    <input class="fi" id="pSearch" placeholder="IP, service, banner..." oninput="debounce(load,350)(1)" style="width:160px">
    <input class="fi" id="pPort"   placeholder="port #" oninput="debounce(load,350)(1)" style="width:80px">
    <input class="fi" id="pIP"     placeholder="IP address" oninput="debounce(load,350)(1)" style="width:130px">
    <select class="fs" id="pDom"  onchange="load(1)"><option value="">all domains</option></select>
    <select class="fs" id="pRisk" onchange="load(1)"><option value="">all risk</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option></select>
    <label class="fl"><input type="checkbox" id="pInt" onchange="load(1)"> interesting only</label>
  </div>
  <div class="tw"><div id="pTable"><div class="loading"><div class="spin"></div></div></div></div>
  <div id="pPager"></div>
</div>
{{end}}
{{define "scripts"}}
<script>
let cp=1;
async function load(p){
  if(p)cp=p;
  const q=new URLSearchParams({search:document.getElementById('pSearch').value,port:document.getElementById('pPort').value,ip:document.getElementById('pIP').value,domain:document.getElementById('pDom').value,risk:document.getElementById('pRisk').value,interesting:document.getElementById('pInt').checked?'1':'',limit:200,page:cp});
  let d;try{d=await api('/api/ports?'+q);}catch(e){document.getElementById('pTable').innerHTML='<div class="empty">error</div>';return;}
  const items=d.data||[];
  document.getElementById('pCount').textContent=(d.total||0).toLocaleString()+' ports';
  const dom=document.getElementById('pDom').value;if(dom)syncDom(dom);
  if(!items.length){document.getElementById('pTable').innerHTML='<div class="empty">no open ports — run a scan</div>';document.getElementById('pPager').innerHTML='';return;}
  const hiRisk=new Set([23,445,3389,5900,6379,27017,9200,11211,2375,5984,873,512,513]);
  document.getElementById('pTable').innerHTML=`<table><thead><tr><th>IP</th><th>Port</th><th>Proto</th><th>Service</th><th>Version</th><th>Banner</th><th>Risk</th><th>First Seen</th></tr></thead><tbody>${
    items.map(p=>{
      const pc=p.risk_level==='high'?'var(--red)':p.risk_level==='medium'?'var(--orange)':'var(--text)';
      const rowHL=hiRisk.has(p.port)?' style="background:rgba(232,58,58,.03)"':'';
      return`<tr${rowHL}>
        <td>${esc(p.ip)}</td>
        <td style="color:${pc};font-weight:700">${p.port}</td>
        <td class="muted">${(p.protocol||'tcp').toUpperCase()}</td>
        <td>${p.service?'<span class="badge bi">'+esc(p.service)+'</span>':'—'}</td>
        <td class="muted">${esc(p.version)||'—'}</td>
        <td class="muted" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(p.banner)}">${esc(p.banner)||'—'}</td>
        <td>${riskBadge(p.risk_level)}</td>
        <td class="muted">${fmtDate(p.first_seen)}</td>
      </tr>`;
    }).join('')
  }</tbody></table>`;
  pager(document.getElementById('pPager'),d.total,cp,200,d.pages,'load');
}
async function loadDoms(){
  try{const d=(await api('/api/domains')).data||[];['pDom','pDomExp'].forEach(id=>{const s=document.getElementById(id);if(!s)return;while(s.options.length>(id==='pDom'?1:0))s.remove(id==='pDom'?1:0);d.forEach(dom=>{const o=document.createElement('option');o.value=o.textContent=dom;s.appendChild(o);});});}catch{}
}
function syncDom(d){const s=document.getElementById('pDomExp');if(s&&d&&!s.value)s.value=d;}
function getDom(){const d=document.getElementById('pDomExp').value;if(!d)toast('select a domain','warn');return d;}
function dlCSV(){const d=getDom();if(d)dl('/api/export/csv?domain='+encodeURIComponent(d)+'&type=ports');}
function dlIPs(){const d=getDom();if(d)dl('/api/export/targets?domain='+encodeURIComponent(d)+'&type=ip-ports');}
function dlMSF(){const d=getDom();if(d)dl('/api/export/msf?domain='+encodeURIComponent(d));}
function refresh(){load(cp);}
loadDoms();load();
</script>
{{end}}
